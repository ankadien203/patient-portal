services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: patient_portal_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: patient_portal_backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_NAME: patient_portal
      DB_USER: patient_app
      DB_PASSWORD: patient_dev_password
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.4
    container_name: patient_portal_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_password
      MYSQL_DATABASE: patient_portal
      MYSQL_USER: patient_app
      MYSQL_PASSWORD: patient_dev_password
    ports:
      - "3307:3306"
    volumes:
      - patient_portal_mysql_data:/var/lib/mysql
    healthcheck:
      test:
        - CMD
        - mysqladmin
        - ping
        - -h
        - localhost
        - -u
        - root
        - -proot_dev_password
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

volumes:
  patient_portal_mysql_data: